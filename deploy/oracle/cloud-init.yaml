#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - rsync
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - /bin/sh -c '. /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - mkdir -p /opt/learn4 /opt/learn4-data/storage
  - chown -R ubuntu:ubuntu /opt/learn4 /opt/learn4-data
  - systemctl enable --now docker
final_message: "Learn4 Oracle host prerequisites are ready"
