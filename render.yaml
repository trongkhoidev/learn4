services:
  - type: web
    name: lexilearn-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TEACHER_ACCESS_CODE
        value: changeme
      - key: DATABASE_URL
        value: sqlite:///./storage/lexilearn.db
      - key: STORAGE_DIR
        value: ./storage
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: STT_PROVIDER
        value: ensemble
      - key: STT_ENSEMBLE_PROVIDERS
        value: deepgram,cloudflare
      - key: STT_ENSEMBLE_MIN_PROVIDERS
        value: "2"
      - key: STT_LATENCY_PROFILE
        value: fast
      - key: STT_PROFILE_VERSION
        value: multi-asr-fast-en-v2
      - key: CLOUDFLARE_STT_MODEL
        value: "@cf/openai/whisper-large-v3-turbo"
      - key: SCORING_VERSION
        value: ielts-evidence-ensemble-v4
